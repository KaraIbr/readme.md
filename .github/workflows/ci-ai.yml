name: CI — AI

on:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "ai/**"
      - "pyproject.toml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check ai/src ai/ui
      - name: Ruff format
        run: uv run ruff format --check ai/src ai/ui

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
      - name: Run AI tests
        run: uv run pytest ai/tests -v --tb=short
