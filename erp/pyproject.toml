[project]
name = "VE-ERP"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlmodel>=0.0.21",
    "alembic",
    "aiosqlite",
    "asyncpg",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "openai>=1.30",
    "langchain-openai",
    "langchain-core",
    "langgraph",
    "httpx",
    "pendulum",
    "structlog",
    "python-slugify",
    "greenlet>=3.5.1",
    "bcrypt<4.1",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "factory-boy",
    "ruff",
    "mypy",
    "pre-commit",
    "commitizen>=4.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["CRM/src"]
testpaths = ["CRM/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
lint.select = ["E", "F", "I", "N", "W", "UP", "SIM", "BLE"]
lint.ignore = ["SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"CRM/src/domains/*/models.py" = ["UP045", "UP037"]
"IAM/src/iam/domains/*/models.py" = ["UP045", "UP037"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
mypy_path = "CRM/src:IAM/src"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true
